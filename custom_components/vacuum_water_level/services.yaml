refilled:
  name: Refill Clean Water Tank
  description: Mark the clean water tank as refilled and calibrate the adaptive water estimation model.
  target:
    entity:
      integration: vacuum_water_level
  fields:
    actual_poured_ml:
      name: Actual Water Poured (mL)
      description: The actual measured volume of water added to calibrate the adaptive model. If omitted, uses estimated volume.
      required: false
      selector:
        number:
          min: 1
          max: 10000
          unit_of_measurement: mL

waste_tank_emptied:
  name: Empty Waste Water Tank
  description: Mark the waste water tank as emptied and calibrate the learned waste-to-clean ratio.
  target:
    entity:
      integration: vacuum_water_level
  fields:
    actual_drained_ml:
      name: Actual Waste Drained (mL)
      description: The actual measured volume of waste water emptied. If omitted, uses estimated volume.
      required: false
      selector:
        number:
          min: 1
          max: 10000
          unit_of_measurement: mL

clear_prediction_model:
  name: Clear Prediction Model
  description: Reset learned area consumption rates and waste ratios back to defaults while preserving hardware reserve volumes.
  target:
    entity:
      integration: vacuum_water_level
